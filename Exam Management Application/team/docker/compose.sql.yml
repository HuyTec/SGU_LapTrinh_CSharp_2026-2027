name: exam-team-local
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${EXAM_SQL_PASSWORD:?Set EXAM_SQL_PASSWORD in this terminal}
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - exam_sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
volumes:
  exam_sql_data:
