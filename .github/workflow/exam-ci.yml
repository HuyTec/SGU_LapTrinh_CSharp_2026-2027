name: Exam CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: 'Exam Management Application'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore 'Exam Management Application.slnx'

      - name: Build
        run: dotnet build 'Exam Management Application.slnx' -c Release --no-restore -m:1

      - name: Test
        run: dotnet test 'Exam.Tests/Exam.Tests.csproj' -c Release --no-build --logger 'console;verbosity=normal'